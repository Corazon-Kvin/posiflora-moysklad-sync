name: 1. Sync Showcase (Витрина)
on:
  schedule:
    - cron: '*/30 * * * *' # Запуск каждые 30 минут
  workflow_dispatch: # Оставляет кнопку для ручного запуска

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow
      - name: Run sync_showcase.py
        env:
          POSIFLORA_USER: ${{ secrets.POSIFLORA_USER }}
          POSIFLORA_PASS: ${{ secrets.POSIFLORA_PASS }}
          POSIFLORA_URL: ${{ secrets.POSIFLORA_URL }}
          MOYSKLAD_TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
          MOYSKLAD_URL: ${{ secrets.MOYSKLAD_URL }}
          TARGET_STORE_ID: ${{ secrets.TARGET_STORE_ID }}
          ORG_ID: ${{ secrets.ORG_ID }}
        run: python sync_showcase.py
